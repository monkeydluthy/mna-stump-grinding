[build]
  command = "cd frontend && npm install && npm run build && cd ../netlify/functions && npm install"
  publish = "frontend/dist"
  functions = "netlify/functions"

# Long-lived cache for hashed Vite assets, self-hosted fonts, and hero images
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/stump-header*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Apex host consolidation — keep in sync with frontend/public/_redirects
# www → non-www (GBP Website field). Path + query string are preserved.
[[redirects]]
  from = "https://www.mnastumpgrinding.com/*"
  to = "https://mnastumpgrinding.com/:splat"
  status = 301
  force = true

# API routes must come BEFORE the catch-all
# Using force = true to ensure this takes precedence over catch-all
[[redirects]]
  from = "/api/reviews/google"
  to = "/.netlify/functions/reviews-google"
  status = 200
  force = true

[[redirects]]
  from = "/api/portfolio"
  to = "/.netlify/functions/portfolio"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth"
  status = 200
  force = true

[[redirects]]
  from = "/api/upload"
  to = "/.netlify/functions/upload"
  status = 200
  force = true

[[redirects]]
  from = "/api/health-check"
  to = "/.netlify/functions/health-check"
  status = 200
  force = true

[[redirects]]
  from = "/api/analytics"
  to = "/.netlify/functions/analytics"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

[[redirects]]
  from = "/api/leads/*"
  to = "/.netlify/functions/leads"
  status = 200
  force = true

# Known SPA routes. Static files are served first because these rules are not forced.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/stump-grinding-thonotosassa-fl"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Everything else is a real 404. Not forced, so robots.txt, sitemap.xml, and assets still win.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
